# Runs the whole suite on every push and pull request, once per browser engine.
# The HTML report, plus the screenshots, videos and traces of failed tests,
# are kept as a downloadable artifact of each run.
name: Tests

on:
  push:
  pull_request:
  schedule:
    # Weekly, without a code change: a broken dependency or a change outside the repository
    # shows up within a week (night in India, before the daily Quality Intelligence collection)
    - cron: '30 22 * * 3'   # Wednesday 22:30 UTC
  # Allows a manual run from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      # One browser failing should not cancel the others
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Downloads the browser plus the Linux libraries it needs
      - name: Install ${{ matrix.browser }}
        run: mvn -B -q compile exec:java -Dexec.args="install --with-deps ${{ matrix.browser }}"

      - name: Run the tests
        run: mvn -B test -Dbrowser=${{ matrix.browser }} -Dheadless=true

      # Kept even when tests fail, so failures can be analysed
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.browser }}
          path: |
            target/surefire-reports/playwright-test-report.html
            target/artifacts/
          if-no-files-found: ignore

      - name: Check collection report identities
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Prepare uniquely identified collection reports
        if: ${{ !cancelled() }}
        run: python3 tools/name_repeated_checks.py

      # JUnit XML only, as its own artifact: the CI results collection of
      # automation-coverage-quality-intelligence imports it (config/producers.toml there)
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.browser }}
          path: target/collection-junit/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30
