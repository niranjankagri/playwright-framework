# Test settings. Every key can be overridden on the command line, e.g. -Dbrowser=firefox -Dheadless=false

# Web shop under test (Sauce Labs demo)
baseUrl=https://www.saucedemo.com
# Password of every Sauce Demo user, shown on its login page
password=secret_sauce

# REST API under test (Restful Booker demo) and its public admin account
apiUrl=https://restful-booker.herokuapp.com
apiUser=admin
apiPassword=password123

# chromium, firefox or webkit
browser=chromium
# false shows the browser window
headless=true
# Milliseconds Playwright pauses after each action; 300 makes a visible run easy to follow
slowMo=0
# Timeout for every page action and auto-waiting assertion
timeoutMillis=10000

# Kept for failed tests only: a Playwright trace (actions, DOM snapshots, network) and a video
trace=true
video=true
